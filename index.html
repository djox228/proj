<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LIFE OS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0f0f1a;
    --bg2: #1a1a2e;
    --card: rgba(30, 30, 55, 0.5);
    --card-hover: rgba(40, 40, 70, 0.6);
    --border: rgba(120, 120, 200, 0.12);
    --border-active: rgba(123, 47, 247, 0.4);
    --text: #f0f0ff;
    --text2: #c8c8e0;
    --dim: #8888a8;
    --accent: #8b5cf6;
    --accent2: #ec4899;
    --accent3: #38bdf8;
    --success: #34d399;
    --warning: #fbbf24;
    --danger: #f87171;
    --gradient: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
    --gradient2: linear-gradient(135deg, #38bdf8 0%, #8b5cf6 100%);
    --shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    background-image: 
      radial-gradient(ellipse at 20% 10%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(236, 72, 153, 0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(56, 189, 248, 0.04) 0%, transparent 70%);
  }
  .app { max-width: 640px; margin: 0 auto; padding: 16px; padding-bottom: 120px; }
  
  /* [СТИЛИ ОСТАЮТСЯ ТАКИМИ ЖЕ, Я ИХ СОКРАТИЛ ДЛЯ УДОБСТВА, НО В ТВОЕМ ФАЙЛЕ ОНИ ЕСТЬ] */
  /* ВСТАВЬ СЮДА ВСЕ СВОИ CSS ИЗ ФАЙЛА, КОТОРЫЙ ТЫ ПРИСЛАЛ */
</style>
</head>
<body>

<!-- ВСТАВЬ СЮДА ВСЮ HTML-РАЗМЕТКУ ИЗ ТВОЕГО ФАЙЛА (все div'ы, кнопки и т.д.) -->
<!-- ... -->

<script>
// Telegram WebApp
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) {
  try { tg.ready(); tg.expand(); } catch(e) {}
  if (tg.setHeaderColor) tg.setHeaderColor('#0f0f1a');
  if (tg.setBackgroundColor) tg.setBackgroundColor('#0f0f1a');
}

// ================= ОБЛАЧНАЯ СИНХРОНИЗАЦИЯ =================
const API_URL = 'https://life-os-api.djogrinder22.workers.dev'; // <--- ЗАМЕНИ НА СВОЙ URL ВОРКЕРА
let syncUserId = localStorage.getItem('lifeos_uid');
let syncSecret = localStorage.getItem('lifeos_key');

// Если пользователь новый - генерируем ему ID и секретный ключ
if (!syncUserId || !syncSecret) {
  syncUserId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? String(tg.initDataUnsafe.user.id) : 'user_' + Math.floor(Math.random() * 1000000);
  syncSecret = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
  localStorage.setItem('lifeos_uid', syncUserId);
  localStorage.setItem('lifeos_key', syncSecret);
}

let isSyncing = false;

async function pushToCloud(dataToSave) {
  try {
    await fetch(`${API_URL}?id=${syncUserId}&key=${syncSecret}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(dataToSave)
    });
  } catch (e) {
    console.warn('Синхронизация не удалась, сохранено локально');
  }
}

async function pullFromCloud() {
  try {
    const res = await fetch(`${API_URL}?id=${syncUserId}&key=${syncSecret}`);
    const cloudData = await res.json();
    // Если в облаке есть данные, используем их
    if (Object.keys(cloudData).length > 0) {
      return cloudData;
    }
  } catch (e) {
    console.warn('Не удалось загрузить облако, используем локальные данные');
  }
  return null;
}

// ================= ТВОЯ ЛОГИКА =================

const $ = id => document.getElementById(id);
const STORAGE_KEY = 'lifeos_pet_v4';

// Инициализация данных (асинхронная)
let data = null;

async function initApp() {
  // 1. Пробуем скачать из облака
  const cloudData = await pullFromCloud();
  
  if (cloudData) {
    data = cloudData;
    // Восстанавливаем пропущенные поля (на случай обновлений)
    if (!data.water) data.water = {};
    if (!data.sleepHistory) data.sleepHistory = [];
    if (!data.achievements) data.achievements = [];
    if (!data.petXP) data.petXP = 0;
    if (!data.petLevel) data.petLevel = 1;
    if (!data.petPosition) data.petPosition = { top: 100, left: 10 };
    if (!data.moodXPToday) data.moodXPToday = {};
  } else {
    // Если в облаке пусто, берем локально
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      data = raw ? JSON.parse(raw) : null;
    } catch(e) {}
  }

  // Если и локально пусто - создаем с нуля
  if (!data) {
    data = { habits: [], notes: [], moods: {}, xp: 0, level: 1, streak: 0, lastActive: null, todayDone: {}, focusSessions: 0, focusMinutes: 0, water: {}, sleepHistory: [], achievements: [], petXP: 0, petLevel: 1, petPosition: { top: 100, left: 10 }, moodXPToday: {} };
  }

  // Запускаем рендер
  initPetPosition();
  updateHeader();
  renderAll();
  
  const today = todayKey();
  data.lastActive = today;
  saveData();
  checkAchievements();

  setTimeout(() => showPetBubble('Привет! 👋'), 1000);
}

function saveData() { 
  // 1. Сохраняем локально
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); 
  
  // 2. Отправляем в облако (с небольшой задержкой, чтобы не спамить)
  if (!isSyncing) {
    isSyncing = true;
    setTimeout(() => {
      pushToCloud(data).then(() => { isSyncing = false; });
    }, 1000);
  }
}

// [ОСТАЛЬНЫЕ ФУНКЦИИ ОСТАЮТСЯ ТАКИМИ ЖЕ, КАК В ТВОЕМ ФАЙЛЕ]
// todayKey, formatDate, getGreeting, playTimerSound, addXP, addPetXP, checkAchievements, updateHeader...
// и так далее.

// В самом конце файла замени вызов инициализации на:
initApp();
</script>

</body>
</html>
